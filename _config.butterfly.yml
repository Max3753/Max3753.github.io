# Butterfly 视觉优化配置

#logo 
nav:
  logo: /img/favicon.png
  display_title: true
  display_post_title: true
  fixed: true

#menu
menu:
  首页: / || fas fa-home
  归档: /archives/ || fas fa-archive
  标签: /tags/ || fas fa-tags
  分类: /categories/ || fas fa-folder-open
  关于: /about/ || fas fa-heart
  友情链接: /link/ || fas fa-link

#代码区域
code_blocks:
  theme: ocean
  macStyle: true
  language: true
  height_limit: false
  word_wrap: false
  copy: true
  copy_text: 复制
  shrink: false
  fullpage: true

#social
social:
  fab fa-github: https://github.com/Max3753 || Github || '#24292e'
  fas fa-envelope: 2964831577@qq.com || Email || '#4a7dbe'
  fab fa-bilibili: https://space.bilibili.com || B站 || '#fb7299'

#标签图标 
favicon: /img/favicon.ico

# avatar 头像
avatar: 
  img: /img/favicon.png
  effect: true

#图片
disable_top_img: false
default_top_img: /img/topimg.jpg
disable_index_img: true
index_img: /img/indeximg.jpg
disable_post_img: false
post_img: /img/postimg.jpg  
footer_img: true
background: /img/topimg.jpg

#封面
cover:
  index_enable: true
  aside_enable: true
  archives_enable: true
  default_cover: 
    - /img/cover1.jpg
    - /img/cover2.jpg
    - /img/cover3.jpg
    - /img/cover4.jpg

#评论
comments:
  use: Valine
  text: true
  lazyload: true
  count: true
  card_post_count: false

valine:
  enenable: true
  appId: T5unit23g2hjYumdb7V44tmv-gzGzoHsz
  appKey: bzNl2n7DEXoV6R9ZmgRtpuKv
  avatar: monsterid
  visitor: false
  path: window.location.pathnamme
  lang: zh-cn
    
#错误页
error_img: 
  flink: /img/friend_404.gif
  post_page: /img/404.jpg

error_404:
  enable: true
  subtitle: 'Page Not Found'
  background: /img/error-page.png

# Lazyload
lazyload:
  enable: true
  native: false
  field: site
  placeholder:
  blur: false

# PWA
pwa:
  enable: true
  manifest: /img/favicon.png
  apple_touch_icon: /img/favicon.png
  favicon_32_32: /img/favicon.png
  favicon_16_16: /img/favicon.png
  mask_icon: /img/favicon.png

# PJAX
pjax:
  enable: true

# Instant.page
instantpage: true

# Preloader
preloader:
  enable: true
  source: 1

# Dark Mode - 跟随系统
darkmode:
  enable: true
  button: true
  autoChangeMode: 1

# Word Count
wordcount:
  enable: true
  post_wordcount: true
  min2read: true
  total_wordcount: true

# Search
search:
  use: local_search
  placeholder: 搜索文章...

  local_search:
    preload: true
    top_n_per_article: 1
    unescape: false

# CDN
CDN:
  internal_provider: jsdelivr
  third_party_provider: jsdelivr

# ========== 视觉优化配置 ==========

# 主题配色
theme_color:
  enable: true
  main: "#49B1F5"
  paginator: "#00c4b6"
  button_hover: "#FF7242"
  text_selection: "#00c4b6"
  link_color: "#99a9bf"
  meta_color: "#858585"
  hr_color: "#A4D8FA"
  code_foreground: "#F47466"
  code_background: "rgba(27, 31, 35, .05)"
  toc_color: "#00c4b6"
  blockquote_padding_color: "#49b1f5"
  blockquote_background_color: "#49b1f5"
  scrollbar_color: "#49B1F5"
  meta_theme_color_light: "ffffff"
  meta_theme_color_dark: "#0d0d0d"

# 首页副标题 - 打字机效果 + 一言API
subtitle:
  enable: true
  effect: true
  typed_option:
  source: 1
  sub:
    - 记录技术成长的点点滴滴
    - 代码改变世界
    - 保持好奇，保持学习

# 首页文章布局 - 信息显示在封面上
index_layout: 5

# 文章摘要显示方式
index_post_content:
  method: 2
  length: 300

# 文章目录
toc:
  post: true
  page: false
  number: true
  expand: false
  style_simple: false
  scroll_percent: true

# 文章版权信息
post_copyright:
  enable: true
  decode: false
  author_href: https://github.com/Max3753
  license: CC BY-NC-SA 4.0
  license_url: https://creativecommons.org/licenses/by-nc-sa/4.0/

# 相关文章
related_post:
  enable: true
  limit: 6
  date_type: created

# 文章分页
post_pagination: 1

# 文章过期提醒
noticeOutdate:
  enable: true
  style: flat
  limit_day: 365
  position: top
  message_prev: 本文最后更新于
  message_next: 天前，内容可能已过时

# 页脚
footer:
  owner:
    enable: true
    since: 2025
  copyright:
    enable: true
    version: true
  custom_text: '<i class="fas fa-heart" style="color: #FF7242"></i> 用代码记录世界'

# 侧边栏
aside:
  enable: true
  hide: false
  button: true
  mobile: true
  position: right
  display:
    archive: true
    tag: true
    category: true
  card_author:
    enable: true
    description: 一个热爱技术的开发者
    button:
      enable: true
      icon: fab fa-github
      text: Follow Me
      link: https://github.com/Max3753
  card_announcement:
    enable: true
    content: 欢迎来到我的博客，一起交流技术！
  card_recent_post:
    enable: true
    limit: 5
    sort: date
  card_categories:
    enable: true
    limit: 8
    expand: none
  card_tags:
    enable: true
    limit: 40
    color: true
    orderby: random
    order: 1
  card_archives:
    enable: true
    type: monthly
    format: MMMM YYYY
    order: -1
    limit: 8
  card_webinfo:
    enable: true
    post_count: true
    last_push_date: true

# Busuanzi 访问统计
busuanzi:
  site_uv: true
  site_pv: true
  page_pv: true

# Canvas Nest 背景粒子
canvas_nest:
  enable: true
  color: '49,177,245'
  opacity: 0.5
  zIndex: -1
  count: 99
  mobile: false

# 点击爱心效果
click_heart:
  enable: true
  mobile: false

# 页面过渡动画
enter_transitions: true

# 圆角
rounded_corners_ui: true

# 遮罩
mask:
  header: true
  footer: true

# 显示模式
display_mode: light

# 分割线图标
hr_icon:
  enable: true

# 字体设置
font:
  global_font_size:
  code_font_size:
  font_family:
  code_font_family:

# 文章美化
beautify:
  enable: true
  field: post
  title_prefix_icon: '\f0c1'

# 分享
share:
  use: sharejs
  sharejs:
    sites: facebook,twitter,wechat,weibo,qq

# Open Graph
Open_Graph_meta:
  enable: true

# 结构化数据
structured_data: true

# CSS 前缀
css_prefix: true

# 注入自定义 CSS
inject:
  head:
    - <link rel="stylesheet" href="/css/custom.css">
  bottom:
    - <script src="/js/custom.js"></script>